<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Juego: Lanzar Moneda (Cámara Fija)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: white;
            overflow: hidden;
            /* Evita que se seleccione texto por accidente al hacer clics rápidos */
            user-select: none; 
        }

        h1 {
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        p {
            margin-top: 0;
            margin-bottom: 20px;
            opacity: 0.8;
        }

        /* Contenedor del juego */
        .game-container {
            position: relative;
            width: 90%;
            max-width: 500px;
            height: 450px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* El visor 3D */
        model-viewer {
            width: 100%;
            height: 100%;
            background-color: transparent;
            cursor: pointer;
            transition: transform 0.1s ease-out; 
        }

        /* Animación del Salto (Se activa con JS) */
        .jumping {
            animation: spinAndJump 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes spinAndJump {
            0% {
                transform: translateY(0) scale(1);
            }
            30% {
                transform: translateY(-150px) scale(1.1); /* Sube */
            }
            70% {
                transform: translateY(-150px) scale(1.1); /* Pausa en el aire */
            }
            100% {
                transform: translateY(0) scale(1); /* Cae */
            }
        }

        /* Letrero de Resultado */
        #result-text {
            font-size: 2rem;
            font-weight: bold;
            margin-top: 20px;
            height: 40px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }

        /* Botón de lanzar */
        .btn-launch {
            background-color: #ff9f43;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: 0.2s;
            margin-top: 15px;
        }
        .btn-launch:hover {
            background-color: #ff9124;
            transform: scale(1.05);
        }
        .btn-launch:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
    </style>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
</head>
<body>

    <h1>¿Cara o Sello?</h1>
    <p>Haz clic en la moneda para lanzarla</p>

    <div class="game-container">
        <model-viewer 
            id="coin"
            src="moneda_Rayen.glb" 
            alt="Moneda 3D Rayen" 
            interaction-prompt="none"
            camera-orbit="0deg 90deg 105%"
            shadow-intensity="1.5">
        </model-viewer>
    </div>

    <div id="result-text">¡Haz tu apuesta!</div>
    
    <button class="btn-launch" id="launch-btn">¡Lanzar Moneda!</button>

    <script>
        const coin = document.getElementById('coin');
        const launchBtn = document.getElementById('launch-btn');
        const resultText = document.getElementById('result-text');
        
        let isSpinning = false;

        function flipCoin() {
            if (isSpinning) return; 
            isSpinning = true;
            
            launchBtn.disabled = true;
            resultText.innerText = "¡En el aire...!";
            resultText.style.color = "white";

            // 1. Decidir el resultado al azar (0 = Cara, 1 = Sello)
            const isCara = Math.random() < 0.5;
            
            // 2. Definir el ángulo de caída final (vueltas completas aleatorias + lado final)
            const extraSpins = (Math.floor(Math.random() * 3) + 3) * 360; 
            const targetY = isCara ? (0 + extraSpins) : (180 + extraSpins); 

            // 3. Activar animación de salto
            coin.classList.add('jumping');

            // 4. Animación controlada del giro por código
            let startTime = performance.now();
            const duration = 1200; 

            function animateSpin(currentTime) {
                let elapsed = currentTime - startTime;
                let progress = Math.min(elapsed / duration, 1);

                let currentY = progress * targetY;
                
                // Forzamos la orientación fija de la cámara mientras gira
                coin.cameraOrbit = `${currentY}deg 90deg 105%`;

                if (progress < 1) {
                    requestAnimationFrame(animateSpin);
                } else {
                    coin.classList.remove('jumping');
                    isSpinning = false;
                    launchBtn.disabled = false;

                    if (isCara) {
                        resultText.innerText = "¡SALIÓ CARA!";
                        resultText.style.color = "#4cd137"; 
                    } else {
                        resultText.innerText = "¡SALIÓ SELLO!";
                        resultText.style.color = "#00a8ff"; 
                    }

                    coin.cameraOrbit = isCara ? "0deg 90deg 105%" : "180deg 90deg 105%";
                }
            }

            requestAnimationFrame(animateSpin);
        }

        coin.addEventListener('click', flipCoin);
        launchBtn.addEventListener('click', flipCoin);
    </script>
</body>
</html>
